name: binaries
on:
  workflow_call:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build inside Debian Bullseye
        run: |
          docker run --rm -v "$PWD:/work" -w /work rust:bullseye sh -ec '
            . /etc/os-release
            test "$VERSION_CODENAME" = bullseye
            cargo build --release --locked --target ${{ matrix.target }}
            target/${{ matrix.target }}/release/spinfoam --version
          '
      - name: Check Bullseye compatibility
        run: |
          python3 scripts/check-glibc.py target/${{ matrix.target }}/release/spinfoam
          target/${{ matrix.target }}/release/spinfoam --version
      - run: python3 scripts/package.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: brew install llvm@19
      - run: echo "$(brew --prefix llvm@19)/bin" >> "$GITHUB_PATH"
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Test Seatbelt builds
        run: cargo test --release --locked --test build -- --include-ignored --nocapture
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: target/${{ matrix.target }}/release/spinfoam --version
      - run: python3 scripts/package.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - name: Sandbox failure diagnostics
        if: failure()
        run: |
          sudo log show --last 5m --style compact --predicate 'eventMessage CONTAINS "spinfoam" OR eventMessage CONTAINS "ignition"' | tail -100
          for report in "$HOME"/Library/Logs/DiagnosticReports/spinfoam*.ips; do
            if [ -f "$report" ]; then head -c 20000 "$report"; fi
          done
